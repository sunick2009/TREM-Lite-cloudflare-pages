<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="description" content="TREM-Lite Web - Taiwan Real-time Earthquake Monitoring" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TREM Web" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TREM-Lite Web</title>
    <script type="module" src="/src-web/main.ts"></script>
  </head>
  <body>
    <div id="map" class="map"></div>

    <!-- EEW Info Box -->
    <div id="info-wrapper" class="info-wrapper no-eew">
      <div class="info-title">
        <div id="info-unit" class="info-unit"></div>
        <div id="info-number" class="info-number"></div>
      </div>
      <div class="info-body-wrapper" id="info-body-wrapper">
        <div id="trigger-box" class="trigger-box"></div>
        <div class="info-box">
          <div class="info-title-wrapper">
            <div id="info-intensity" class="info-title-box"></div>
            <div class="info-intensity"></div>
          </div>
          <div class="info-more">
            <div id="info-loc" class="info-loc"></div>
            <div id="info-time" class="info-time"></div>
            <div id="info-footer" class="info-footer nsspe">
              <div class="info-nsspe"><span></span></div>
              <div class="info-mag-dep">
                <div class="info-mag">
                  <div class="info-mag-text"></div>
                  <div id="info-mag" class="info-mag-val"></div>
                </div>
                <div class="info-depth">
                  <div class="info-depth-text"></div>
                  <div id="info-depth" class="info-depth-val"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="cancel-box">
          <div class="cancel-title"><span></span></div>
          <div class="cancel-body"><span></span></div>
        </div>
      </div>
    </div>

    <!-- Intensity Color List -->
    <div class="intensity-color-list-wrapper">
      <ul class="intensity-color-list">
        <li class="intensity-li intensity-num-1"><span class="color"></span>1</li>
        <li class="intensity-li intensity-num-2"><span class="color"></span>2</li>
        <li class="intensity-li intensity-num-3"><span class="color"></span>3</li>
        <li class="intensity-li intensity-num-4"><span class="color"></span>4</li>
        <li class="intensity-li intensity-num-5"><span class="color"></span>5⁻</li>
        <li class="intensity-li intensity-num-6"><span class="color"></span>5⁺</li>
        <li class="intensity-li intensity-num-7"><span class="color"></span>6⁻</li>
        <li class="intensity-li intensity-num-8"><span class="color"></span>6⁺</li>
        <li class="intensity-li intensity-num-9"><span class="color"></span>7</li>
      </ul>
    </div>

    <!-- Max Intensity / PGA -->
    <div class="max-intensity-pga-wrapper">
      <div class="max-intensity">
        <div class="max-intensity-text"></div>
        <div id="max-intensity" class="max-station-intensity intensity-0"></div>
      </div>
      <div class="max-pga">
        <div class="max-pga-text"></div>
        <div id="max-pga" class="max-station-pga intensity-0"></div>
      </div>
    </div>

    <!-- Station Intensity / PGA -->
    <div class="station-pga-wrapper">
      <div class="current-station-pga">
        <div class="current-station-info">
          <div id="current-station-loc" class="current-station-loc"></div>
          <div class="current-station-intensity-pga">
            <div class="current-station-intensity-box">
              <div class="current-station-intensity-text"></div>
              <div id="current-station-intensity-text" class="current-station-intensity-val"></div>
            </div>
            <div class="current-station-intensity-box">
              <div class="current-station-pga-text"></div>
              <div id="current-station-pga" class="current-station-pga-val"></div>
            </div>
          </div>
        </div>
        <div id="current-station-intensity" class="current-station-intensity intensity-0"></div>
      </div>
      <div class="rts-info-box">
        <div class="rts-info-item">
          <div>level</div>
          <div id="rts-info-level" class="rts-info-level"></div>
        </div>
        <div class="rts-info-item">
          <div>trigger</div>
          <div id="rts-info-trigger" class="rts-info-trigger"></div>
        </div>
      </div>
    </div>

    <!-- Report List -->
    <div class="report-wrapper">
      <div class="report-list-btn" id="close-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20">
          <path d="M20 0H0v20h20zm-7.354 14.166-1.389 1.439-5.737-5.529 5.729-5.657 1.4 1.424-4.267 4.215z" fill="#464646" transform="scale(-1, 1) translate(-20, 0)"/>
        </svg>
      </div>
      <div class="report-scroll">
        <div class="report-contain">
          <div class="report-box">
            <div id="report-box-items" class="report-box-items"></div>
            <div class="custom-scrollbar-wrapper">
              <div class="custom-scrollbar"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- RTS Intensity List -->
    <div class="rts-intensity-list-wrapper">
      <div class="rts-intensity-list-box">
        <div class="rts-intensity-list-container">
          <div class="rts-intenisty-list-text"></div>
          <div id="rts-intensity-list" class="rts-intensity-list"></div>
        </div>
      </div>
    </div>

    <!-- Version -->
    <div class="current-version-view">
      <div id="current-version" class="current-version"></div>
    </div>

    <!-- Warning Messages -->
    <div class="warning-message-wrapper">
      <div id="warning-box-internet" class="warning-message-box internet-error hide">
        <div class="warning-message-contain">
          <div class="warning-message-icon">
            <div class="icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor">
                <path d="m684-389-49-49q22-26 33.5-57t11.5-65q0-40-16-76t-44-64l48-48q38 38 59 86t21 102q0 48-17 91.5T684-389ZM565-508 428-645q12-7 25-11t27-4q42 0 71 29t29 71q0 14-4 27t-11 25Zm215 214-48-48q40-45 60-101.5T812-560q0-66-24.5-127.5T716-796l48-48q55 58 85.5 131T880-560q0 74-25.5 142.5T780-294Zm11 238L520-327v207h-80v-287L280-566v6q0 40 16 76t44 64l-48 48q-38-38-59-86t-21-102q0-17 2-33t7-33l-51-51q-11 29-16.5 58t-5.5 59q0 66 24.5 127.5T244-324l-48 48q-55-58-85.5-131T80-560q0-44 9.5-86.5T118-729l-62-62 56-57 736 736-57 56Z"/>
              </svg>
              <div class="title">網路異常</div>
            </div>
          </div>
          <div class="warning-message-text">
            <div class="text"><span>無法取得即時資料</span><span>請確認網路連線</span></div>
          </div>
        </div>
      </div>
      <div id="warning-box-unstable" class="warning-message-box unstable hide">
        <div class="warning-message-contain">
          <div class="warning-message-icon">
            <div class="icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor">
                <path d="M200-400q0 52 21 98.5t60 81.5q-1-5-1-9v-9q0-32 12-60t35-51l113-111 113 111q23 23 35 51t12 60v9q0 4-1 9 39-35 60-81.5t21-98.5q0-50-18.5-94.5T608-574q-20 13-42 19.5t-45 6.5q-62 0-107.5-41T361-690q-39 33-69 68.5t-50.5 72Q221-513 210.5-475T200-400Zm240 52-57 56q-11 11-17 25t-6 29q0 32 23.5 55t56.5 23q33 0 56.5-23t23.5-55q0-16-6-29.5T497-292l-57-56Zm0-492v132q0 34 23.5 57t57.5 23q18 0 33.5-7.5T582-658l18-22q74 42 117 117t43 163q0 134-93 227T440-80q-134 0-227-93t-93-227q0-129 86.5-245T440-840Z"/>
              </svg>
              <div class="title">震動異常</div>
            </div>
          </div>
          <div class="warning-message-text">
            <div class="text"><span>短時間偵測到強烈震動</span><span>可能為交通干擾</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Nav Bar -->
    <div class="nav-bar-wrapper">
      <div class="nav-bar-buttons">
        <div id="setting" class="nav-bar-setting" style="display: none">
          <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="20" height="20" viewBox="0 0 24 24">

        </div>
        <div id="focus" class="nav-bar-location">
          <svg width="20" height="20" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

          </svg>
        </div>
        <div class="connect">
          <div class="time time-error" id="time"></div>
        </div>
      </div>
    </div>
  </body>
</html>
